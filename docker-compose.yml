services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: satemis
      POSTGRES_PASSWORD: satemis
      POSTGRES_DB: satemis
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satemis"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 2; done;
      mc mb --ignore-existing local/satemis;
      mc anonymous set download local/satemis;
      echo 'minio bucket ready';
      "

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      SATEMIS_ENV: prod
      SATEMIS_DATA_SOURCE: synthetic
      SATEMIS_DB__URL: postgresql+psycopg://satemis:satemis@postgres:5432/satemis
      SATEMIS_REDIS__URL: redis://redis:6379/0
      SATEMIS_STORAGE__BACKEND: s3
      SATEMIS_STORAGE__S3_ENDPOINT: minio:9000
    ports: ["8000:8000"]
    depends_on: [postgres, redis, minio]

  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    command: celery -A satemis.workers.celery_app worker -l info -Q main,co,o3,inversion
    environment:
      SATEMIS_ENV: prod
      SATEMIS_DATA_SOURCE: synthetic
      SATEMIS_DB__URL: postgresql+psycopg://satemis:satemis@postgres:5432/satemis
      SATEMIS_REDIS__URL: redis://redis:6379/0
      SATEMIS_STORAGE__BACKEND: s3
      SATEMIS_STORAGE__S3_ENDPOINT: minio:9000
    depends_on: [postgres, redis, minio]

  prefect:
    image: prefecthq/prefect:2-python3.11
    command: prefect server start --host 0.0.0.0
    ports: ["4200:4200"]
    depends_on: [postgres]

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    environment:
      VITE_API_BASE: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
