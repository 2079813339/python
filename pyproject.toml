[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satemis"
version = "0.1.0"
description = "SatEmis - satellite emission monitoring, reconstruction and inversion platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  # --- core (offline-capable, no compilation needed) ---
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "xarray>=2024.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "lightgbm>=4.3",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
geo = ["pyproj>=3.6", "shapely>=2.0", "rioxarray>=0.15", "rasterio>=1.3", "geopandas>=0.14"]
store = ["zarr>=2.17", "numcodecs>=0.12", "netcdf4>=1.6", "h5netcdf>=1.3", "pyarrow>=15.0",
         "minio>=7.2", "boto3>=1.34"]
queue = ["redis>=5.0", "celery[redis]>=5.3", "prefect>=2.19"]
dl = ["torch>=2.2", "onnxruntime>=1.17"]
krige = ["pykrige>=1.7"]
explain = ["shap>=0.45", "optuna>=3.6"]
tracking = ["mlflow>=2.11"]
report = ["weasyprint>=61"]
auth = ["python-jose[cryptography]>=3.3", "passlib[bcrypt]>=1.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.98", "ruff>=0.3", "mypy>=1.9",
       "pre-commit>=3.6", "types-PyYAML>=6.0", "pandas-stubs>=2.2"]
all = [
  "satemis[geo,store,queue,dl,krige,explain,tracking,auth]",
]

[project.scripts]
satemis = "satemis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
satemis = ["data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
# user-facing Chinese HTML template keeps fullwidth punctuation intentionally
"src/satemis/reporting/*" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["satemis"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=satemis --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]
markers = [
  "ml: machine-learning regression gates (may be slow)",
  "integration: requires full local stack of synthetic data",
  "e2e: end-to-end pipeline smoke",
  "regression: CI robustness gates (gap-fraction sweep, wind sensitivity, etc.)",
]

[tool.coverage.run]
source = ["satemis"]
omit = ["src/satemis/api/*", "src/satemis/cli.py"]

[tool.coverage.report]
fail_under = 70
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
